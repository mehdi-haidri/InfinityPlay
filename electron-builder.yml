appId: com.infinityplay.desktop
productName: InfinityPlay
copyright: Copyright © EL HADRATI Othman

# electron-updater reads this at runtime to find the release feed. `owner`/`repo` must
# match the public repository the installers are published to.
publish:
  provider: github
  owner: ELhadratiOth
  repo: InfinityPlay
  releaseType: release

# RELEASES.md becomes the description of the GitHub release.
releaseInfo:
  releaseNotesFile: RELEASES.md

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

asar: true

# castv2 loads `cast_channel.proto` from beside its own source at runtime. Reading it from inside
# the archive is fragile, so the Chromecast sender is unpacked to the filesystem.
asarUnpack:
  - node_modules/castv2/**

# Stages the FFmpeg binaries for the target platform/arch into build/bin.
beforePack: build/prepare-ffmpeg.cjs

# Windows/macOS tools ship beside the app rather than inside asar. Linux receives only
# a marker file and resolves ffmpeg/ffprobe from the system PATH.
extraResources:
  - from: build/bin
    to: bin

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true

mac:
  # Direct-download builds are intentionally unsigned until Apple Developer credentials
  # are configured. Hardened runtime without a real signature can prevent the app from
  # launching, so all three settings must change together when signing is enabled.
  identity: null
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64]
    # Squirrel.Mac/electron-updater requires the ZIP and latest-mac.yml alongside the DMG.
    - target: zip
      arch: [arm64]
  category: public.app-category.entertainment
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  # Keep the installed desktop filename aligned with Electron's app_id/WM_CLASS so
  # launchers group the running window under the InfinityPlay icon.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: AudioVideo
  synopsis: Stream movies, series, anime and live TV
  description: Desktop app for finding and streaming movies, TV shows, anime and live TV.
  maintainer: EL HADRATI Othman <othmanelhadrati@gmail.com>
  vendor: EL HADRATI Othman
  executableName: infinityplay
  icon: icon.png
  desktop:
    entry:
      Name: InfinityPlay
      Comment: Stream movies, series, anime and live TV
      Categories: AudioVideo;Video;
      Keywords: movies;series;anime;television;streaming;
      StartupWMClass: InfinityPlay
      Terminal: false
      Type: Application
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

rpm:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - ffmpeg
