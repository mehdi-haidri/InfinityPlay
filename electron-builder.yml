appId: com.infinityplay.desktop
productName: InfinityPlay
copyright: Copyright © EL HADRATI Othman

# electron-updater reads this at runtime to find the release feed. `owner`/`repo` must
# match the public repository the installers are published to.
publish:
  provider: github
  owner: ELhadratiOth
  repo: InfinityPlay
  releaseType: release

# RELEASES.md becomes the description of the GitHub release.
releaseInfo:
  releaseNotesFile: RELEASES.md

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.entertainment
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
