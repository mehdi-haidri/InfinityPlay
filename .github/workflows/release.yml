name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  validate:
    name: Validate source and version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require tag to match package version
        run: >-
          node -e "const p=require('./package.json');
          const expected='v'+p.version;
          const actual=process.env.GITHUB_REF_NAME;
          if(actual!==expected){console.error('Expected tag '+expected+', received '+actual);process.exit(1)}"

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  windows:
    name: Package Windows x64 and arm64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder downloads the Electron binary and its own helpers during
      # packaging. Those requests fail intermittently ("socket hang up"), which is a
      # network problem rather than a build problem, so they are cached between runs and
      # the packaging step is retried.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: .cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Build NSIS installer
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npm run dist:win; then exit 0; fi
            echo "::warning::packaging attempt $attempt failed, retrying"
            sleep 20
          done
          echo "::error::packaging failed after 3 attempts"
          exit 1

      - name: Confirm FFmpeg was bundled
        shell: bash
        run: |
          set -euo pipefail
          test -f release/win-unpacked/resources/bin/ffmpeg.exe || test -f release/win-arm64-unpacked/resources/bin/ffmpeg.exe
          test -f release/win-unpacked/resources/bin/ffprobe.exe || test -f release/win-arm64-unpacked/resources/bin/ffprobe.exe

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest*.yml

  macos:
    name: Package macOS x64 and arm64
    needs: validate
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm installs only the runner's own architecture, but this job packages x64 as well
      # as arm64. The @rse/ffmpeg post-install downloads only the host's binary, so the
      # x64 binary is fetched from the same GitHub release that @rse/ffmpeg uses. FFprobe
      # still uses the per-platform @ffprobe-installer package.
      - name: Add x64 FFmpeg and FFprobe binaries for the cross build
        shell: bash
        run: |
          set -euo pipefail
          # --- FFmpeg x64 from @rse/ffmpeg GitHub release ---
          ffmpeg_dir="node_modules/@rse/ffmpeg/ffmpeg.d"
          mkdir -p "$ffmpeg_dir"
          rse_version=$(node -p "require('./node_modules/@rse/ffmpeg/package.json').version")
          curl -fsSL -o "$ffmpeg_dir/ffmpeg-mac-x64" \
            "https://github.com/rse/ffmpeg/releases/download/${rse_version}/ffmpeg-mac-x64"
          chmod +x "$ffmpeg_dir/ffmpeg-mac-x64"
          file "$ffmpeg_dir/ffmpeg-mac-x64"

          # --- FFprobe x64 from @ffprobe-installer ---
          target="node_modules/@ffprobe-installer/darwin-x64"
          mkdir -p "$target"
          tarball=$(npm pack @ffprobe-installer/darwin-x64 --silent | tail -1)
          tar -xzf "$tarball" -C "$target" --strip-components=1
          rm -f "$tarball"
          chmod +x "$target/ffprobe"
          file "$target/ffprobe"

      # electron-builder downloads the Electron binary and its own helpers during
      # packaging. Those requests fail intermittently ("socket hang up"), which is a
      # network problem rather than a build problem, so they are cached between runs and
      # the packaging step is retried.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: .cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Build unsigned DMG and ZIP packages
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npm run dist:mac; then exit 0; fi
            echo "::warning::packaging attempt $attempt failed, retrying"
            sleep 20
          done
          echo "::error::packaging failed after 3 attempts"
          exit 1

      - name: Verify DMG containers and architectures
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for dmg in release/*.dmg; do
            hdiutil verify "$dmg"
          done
          for arch in x64 arm64; do
            test -f "release/InfinityPlay-${version}-mac-${arch}.dmg"
            test -f "release/InfinityPlay-${version}-mac-${arch}.zip"
            grep -F "InfinityPlay-${version}-mac-${arch}.zip" release/latest-mac.yml
          done
          find release -path "*/InfinityPlay.app/Contents/MacOS/InfinityPlay" -exec file {} \;
          # The bundled FFmpeg must match the app's architecture, or it cannot be spawned.
          for app_dir in release/mac*/InfinityPlay.app; do
            test -x "$app_dir/Contents/Resources/bin/ffmpeg"
            test -x "$app_dir/Contents/Resources/bin/ffprobe"
            file "$app_dir/Contents/Resources/bin/ffmpeg"
          done

      - name: Confirm app bundles are intentionally unsigned
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' app; do
            found=1
            if codesign --verify --deep --strict "$app"; then
              echo "Unexpected signed bundle: $app" >&2
              exit 1
            fi
          done < <(find release -name "InfinityPlay.app" -print0)
          test "$found" -eq 1

      - name: Upload macOS release files
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  linux:
    name: Package Linux x64 and arm64
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libarchive-tools rpm xz-utils zstd

      # electron-builder downloads the Electron binary and its own helpers during
      # packaging. Those requests fail intermittently ("socket hang up"), which is a
      # network problem rather than a build problem, so they are cached between runs and
      # the packaging step is retried.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: .cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Build AppImage, DEB, RPM, and Arch packages
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npm run dist:linux; then exit 0; fi
            echo "::warning::packaging attempt $attempt failed, retrying"
            sleep 20
          done
          echo "::error::packaging failed after 3 attempts"
          exit 1

      - name: Inspect package metadata and contents
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -name "*.AppImage" | head -n 1)
          deb=$(find release -maxdepth 1 -name "*.deb" | head -n 1)
          rpm_package=$(find release -maxdepth 1 -name "*.rpm" | head -n 1)
          arch_package=$(find release -maxdepth 1 -name "*.pkg.tar.zst" | head -n 1)
          test -n "$appimage" && test -n "$deb" && test -n "$rpm_package" && test -n "$arch_package"
          dpkg-deb --info "$deb"
          rpm --query --package --info "$rpm_package"
          dpkg-deb --field "$deb" Depends | grep -F ffmpeg
          rpm --query --package --requires "$rpm_package" | grep -F ffmpeg
          tar --list --file "$arch_package" >/dev/null
          tar --extract --to-stdout --file "$arch_package" .PKGINFO | grep -F "depend = ffmpeg"
          test "$(tar --extract --to-stdout --file "$arch_package" opt/InfinityPlay/resources/package-type)" = "pacman"
          x64_appimage=$(find release -maxdepth 1 -name "*x64*.AppImage" -o -name "*x86_64*.AppImage" | head -n 1)
          target_appimage="${x64_appimage:-$appimage}"
          chmod +x "$target_appimage"
          "$target_appimage" --appimage-extract >/dev/null
          test ! -e squashfs-root/resources/bin/ffmpeg
          test ! -e squashfs-root/resources/bin/ffprobe
          test -f squashfs-root/resources/bin/SYSTEM_FFMPEG_REQUIRED.txt

      - name: Upload Linux release files
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/latest-linux*.yml 

  android:
    name: Package Android APK (Android & Android TV)
    needs: validate
    runs-on: ubuntu-22.04
    # The signing keystore lives in the `secrets` environment, not in repository secrets.
    # Without this, `secrets.ANDROID_*` resolve to empty and the job silently falls back
    # to the unsigned validation path.
    environment: secrets
    env:
      # GitHub does not allow `secrets.*` directly in a step `if`. Resolve the complete
      # four-secret contract once, then use the boolean for every signing-only step.
      ANDROID_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run cap:sync

      - name: Prepare Android signing key
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/infinityplay-release.jks"

          # Tolerate the two ways this secret usually arrives damaged: wrapped across
          # lines, and carrying the BEGIN/END markers that `certutil -encode` adds on
          # Windows. Both decode to garbage that only fails later, inside Gradle.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | grep -v -- '-----' | tr -d '[:space:]' | base64 --decode > "$keystore"

          test -s "$keystore" || { echo "::error::Decoded Android keystore is empty."; exit 1; }

          # A keystore is either JKS (magic FEEDFEED) or PKCS#12 (a DER sequence, 0x30).
          # Checking the magic here turns Gradle's opaque "DerInputStream.getLength():
          # lengthTag=..., too big" into a message that names the actual problem.
          magic=$(head -c 4 "$keystore" | od -An -tx1 | tr -d '[:space:]')
          case "$magic" in
            feedfeed*) echo "Keystore format: JKS" ;;
            30*)       echo "Keystore format: PKCS#12" ;;
            *)
              echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore (leading bytes: $magic). Re-create the secret with: base64 -w0 my-release.jks"
              exit 1
              ;;
          esac

          # Confirm the password opens the store and the alias exists, before Gradle runs.
          if ! keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore decoded correctly, but ANDROID_KEYSTORE_PASSWORD does not open it."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Alias '$ANDROID_KEY_ALIAS' is not in this keystore. Entries found:"
            keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2> /dev/null | grep -E 'Entry' || true
            exit 1
          fi
          echo "Keystore verified: '$ANDROID_KEY_ALIAS' present, password accepted."

      - name: Build signed Android release APK
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/infinityplay-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Validate Android without release signing
        if: env.ANDROID_SIGNING_ENABLED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Android signing secrets are incomplete. Android will be tested, but no APK will be attached to this GitHub Release."
          cd android
          chmod +x gradlew
          ./gradlew test lint assembleDebug

      - name: Prepare APK release asset
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk "release-apk/InfinityPlay-${version}-android-universal.apk"

      - name: Upload Android release files
        if: env.ANDROID_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          if-no-files-found: error
          path: release-apk/*.apk

  publish:
    name: Publish GitHub Release
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packaged release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update the release
        shell: bash
        run: |
          set -euo pipefail
          # RELEASES.md is the release description. `gh release edit` runs on the
          # already-exists path too, so re-running the workflow refreshes the notes
          # rather than leaving whatever the first run published.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASES.md
          else
            gh release create "$TAG" --verify-tag --title "InfinityPlay $TAG" --notes-file RELEASES.md
          fi
          gh release upload "$TAG" release-assets/* --clobber
